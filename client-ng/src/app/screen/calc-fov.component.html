<div class="form form1">
    <div class="label right-center-content">Sensor X:</div>
    <div class="value-wrapper center-content">
        <div class="value editable right-center-content" (click)="onEdit('x')">{{xSize}}</div>
    </div>

    <div class="unit left-center-content">mm</div>

    <div class="label right-center-content">Sensor Y:</div>
    <div class="value-wrapper center-content">
        <div class="value editable right-center-content" (click)="onEdit('y')">{{ySize}}</div>
    </div>
    <div class="unit left-center-content">mm</div>

    <div class="label right-center-content">Focal distance:</div>
    <div class="value-wrapper center-content">
        <div class="value editable right-center-content" (click)="onEdit('f')">{{focalDistance}}</div>
    </div>
    <div class="unit left-center-content">mm</div>

    <div class="label right-center-content">D:</div>
    <div class="right-center-content">{{dSize |toFixed}}</div>
    <div class="unit left-center-content">mm</div>

    <div class="label right-center-content">FOV X:</div>
    <div class="right-center-content">{{xFov | toFixed}}</div>
    <div class="unit left-center-content">°</div>

    <div class="label right-center-content">FOV Y:</div>
    <div class="right-center-content">{{yFov| toFixed}}</div>
    <div class="unit left-center-content">°</div>

    <div class="label right-center-content">FOV D:</div>
    <div class="right-center-content">{{dFov| toFixed}}</div>
    <div class="unit left-center-content">°</div>
</div>

<div class="form form2">
    <div class="label left-center-content">Overlap:</div>
    <div class="value-wrapper center-content">
        <div class="value editable right-center-content" (click)="onEdit('o')">{{overlap}}</div>
    </div>

    <div></div>
    <div></div>

    <div></div>
    <div></div>

    <div></div>
    <div></div>

    <div class="label right-center-content">n X:</div>
    <div class="center-content">{{nX |toFixed}}</div>

    <div class="label right-center-content">n Y:</div>
    <div class="center-content">{{nY |toFixed}}</div>

    <div class="label right-center-content">n ∑:</div>
    <div class="center-content">{{nSum |toFixed:0 }}</div>
</div>

<app-modal class="modal-num-pad" id="calc" (close)="onEditorClose()">
    <app-number-pad [(value)]="temp">
    </app-number-pad>
</app-modal>
