<movement-controller>

  <div top-left class="infobox info-border" (click)="modalService.open('pano-fov-set')" *ngIf="!fov?.fullX || !fov?.fullY">
      <div class="top center-content" *ngIf="!fov?.fullY">
        <span class="value">{{vFromText}}</span>
      </div>
      <div class="bottom center-content" *ngIf="!fov?.fullY">
        <span class="value">{{vToText}}</span>
      </div>
      <div class="left center-content" *ngIf="!fov?.fullX">
        <span class="value">{{hFromText}}</span>
      </div>
      <div class="right center-content" *ngIf="!fov?.fullX">
        <span class="value">{{hToText}}</span>
      </div>
      <div class="center center-content">
        <img class="click-icon" alt="click icon" src="/assets/hand-clicking-icon.svg" width="25px">
    </div>
  </div>

  <div top-right class="infobox info-range">
    <div class="right-center-content h-label">
      <span class="value">H:</span>
    </div>
    <div class="left-center-content h-value">
      <span class="value" *ngIf="!fov?.fullX">{{hText}}</span>
      <span class="value symbol-all_inclusive" *ngIf="fov?.fullX"></span>
    </div>
    <div class="right-center-content v-label"><span class="value">V:</span></div>
    <div class="left-center-content v-value">
      <span class="value" *ngIf="!fov?.fullY">{{vText}}</span>
      <span class="value symbol-all_inclusive" *ngIf="fov?.fullY"></span>
    </div>
  </div>

  <div bottom-left class="infobox set-partial full-xy center-content">
    <div class="button toggle x" (click)="onFullX()">
      <span class="checked symbol-check_box" *ngIf="fov?.fullX"></span>
      <span class="unchecked symbol-check_box_outline_blank" *ngIf="!fov?.fullX">
      </span>
      FullX ⇔
    </div>
    <div class="button toggle y" (click)="onFullY()">
      <span class="checked symbol-check_box" *ngIf="fov?.fullY">
      </span>
      <span class="unchecked symbol-check_box_outline_blank" *ngIf="!fov?.fullY">
      </span>
      FullY ⇕
    </div>
  </div>

  <div bottom-right class="infobox pano-calc">
    <div class="right-center-content h-label"><span class="value">Columns:</span></div>
    <div class="left-center-content h-value"><span class="value">{{panoMatrix?.maxXSize}}</span>
    </div>

    <div class="right-center-content v-label"><span class="value">Rows:</span></div>
    <div class="left-center-content v-value"><span class="value">{{panoMatrix?.ySize}}</span></div>
  </div>
</movement-controller>

<app-modal class="modal-system-dialog" id="pano-fov-set">
  <div class="set-dialog">
      <div class="button top" (click)="onTop()">Top</div>
      <div class="button left" (click)="onLeft()">Left</div>
      <div class="close-button button center" (click)="onClosePopup()">
          <span class=symbol-close></span>
      </div>
      <div class="button right" (click)="onRight()">Right</div>
      <div class="button bottom" (click)="onBottom()">Bottom</div>
  </div>
</app-modal>
