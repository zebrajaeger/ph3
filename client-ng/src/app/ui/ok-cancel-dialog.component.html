<div class="modal ok-cancel-root" *ngIf="visible">
    <div class="message">{{message}}</div>
    <div class="button ok center-content" (click)="_onOk()">&nbsp;
        <span class="symbol-done"> Ok</span>
    </div>
    <div class="button cancel center-content" (click)="_onCancel()">&nbsp;
        <span class="symbol-close"> Cancel</span>
    </div>
</div>
